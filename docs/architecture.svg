<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
  </defs>

  <rect width="1400" height="900" fill="#f7f8fa"/>

  <text x="700" y="45" text-anchor="middle" font-size="26" font-weight="700" fill="#0b1220">Multi-Agent Deal Review Pipeline — Architecture</text>

  <!-- Infra lane -->
  <rect x="40" y="80" width="380" height="120" rx="10" fill="#ffffff" stroke="#e2e5eb"/>
  <text x="230" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#5b6472">FRONTEND — Vercel</text>
  <text x="230" y="135" text-anchor="middle" font-size="14" fill="#0b1220">Next.js (App Router)</text>
  <text x="230" y="158" text-anchor="middle" font-size="12" fill="#5b6472">Upload · Live SSE Timeline · Report View</text>

  <rect x="510" y="80" width="380" height="120" rx="10" fill="#ffffff" stroke="#e2e5eb"/>
  <text x="700" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#5b6472">BACKEND — Railway</text>
  <text x="700" y="135" text-anchor="middle" font-size="14" fill="#0b1220">FastAPI + LangGraph Orchestrator</text>
  <text x="700" y="158" text-anchor="middle" font-size="12" fill="#5b6472">POST /runs · GET /runs/:id/events (SSE) · GET /runs/:id</text>

  <rect x="980" y="80" width="380" height="120" rx="10" fill="#ffffff" stroke="#e2e5eb"/>
  <text x="1170" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#5b6472">STORAGE — Railway</text>
  <text x="1170" y="135" text-anchor="middle" font-size="14" fill="#0b1220">Postgres</text>
  <text x="1170" y="158" text-anchor="middle" font-size="12" fill="#5b6472">runs table: status, result_json, report_md</text>

  <line x1="420" y1="140" x2="510" y2="140" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="465" y="128" text-anchor="middle" font-size="10" fill="#5b6472">SSE / REST</text>
  <line x1="890" y1="140" x2="980" y2="140" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="935" y="128" text-anchor="middle" font-size="10" fill="#5b6472">read/write</text>

  <!-- Pipeline lane -->
  <rect x="40" y="240" width="1320" height="600" rx="14" fill="#ffffff" stroke="#e2e5eb"/>
  <text x="70" y="270" font-size="15" font-weight="700" fill="#0b1220">LangGraph StateGraph — shared DealState passed node to node</text>

  <!-- Ingestion -->
  <rect x="70" y="300" width="230" height="150" rx="10" fill="#f2f0ff" stroke="#c9c2f5"/>
  <text x="185" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#0b1220">0. Ingestion Agent</text>
  <text x="185" y="348" text-anchor="middle" font-size="11" fill="#5b6472">PDF / DOCX / MD</text>
  <text x="185" y="366" text-anchor="middle" font-size="11" fill="#5b6472">PyMuPDF + python-docx</text>
  <text x="185" y="384" text-anchor="middle" font-size="11" fill="#5b6472">Tesseract OCR (scanned</text>
  <text x="185" y="400" text-anchor="middle" font-size="11" fill="#5b6472">pages + embedded images)</text>
  <text x="185" y="422" text-anchor="middle" font-size="11" font-weight="600" fill="#2451c9">→ clause_index, page_map</text>

  <!-- Extraction -->
  <rect x="340" y="300" width="230" height="150" rx="10" fill="#f2f0ff" stroke="#c9c2f5"/>
  <text x="455" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#0b1220">1. Term Extraction</text>
  <text x="455" y="348" text-anchor="middle" font-size="11" fill="#5b6472">LLM, structured output</text>
  <text x="455" y="366" text-anchor="middle" font-size="11" fill="#5b6472">Every term cites a</text>
  <text x="455" y="382" text-anchor="middle" font-size="11" fill="#5b6472">clause_id + verbatim quote</text>
  <text x="455" y="405" text-anchor="middle" font-size="11" font-weight="600" fill="#2451c9">→ terms[], gaps[]</text>
  <rect x="360" y="415" width="190" height="24" rx="6" fill="#fff" stroke="#c9c2f5"/>
  <text x="455" y="431" text-anchor="middle" font-size="10" fill="#5b6472">retry once on &gt;20% unverified</text>

  <!-- Verification (deterministic) -->
  <rect x="610" y="300" width="230" height="150" rx="10" fill="#fff7e6" stroke="#eccf8b"/>
  <text x="725" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#0b1220">Evidence Verification</text>
  <text x="725" y="348" text-anchor="middle" font-size="11" fill="#5b6472">Pure Python — no LLM</text>
  <text x="725" y="366" text-anchor="middle" font-size="11" fill="#5b6472">Quote must exist verbatim</text>
  <text x="725" y="382" text-anchor="middle" font-size="11" fill="#5b6472">(exact or fuzzy ≥0.90) in</text>
  <text x="725" y="398" text-anchor="middle" font-size="11" fill="#5b6472">the cited clause</text>
  <text x="725" y="422" text-anchor="middle" font-size="11" font-weight="600" fill="#b8860b">→ verified: bool per citation</text>

  <!-- Compliance fanout -->
  <rect x="880" y="300" width="260" height="150" rx="10" fill="#f2f0ff" stroke="#c9c2f5"/>
  <text x="1010" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#0b1220">2. Compliance Review</text>
  <text x="1010" y="348" text-anchor="middle" font-size="11" fill="#5b6472">LLM · fanned out via Send()</text>
  <text x="1010" y="366" text-anchor="middle" font-size="11" fill="#5b6472">rule batches of 5, parallel</text>
  <text x="1010" y="382" text-anchor="middle" font-size="11" fill="#5b6472">status: pass / fail /</text>
  <text x="1010" y="398" text-anchor="middle" font-size="11" fill="#5b6472">needs_human_review</text>
  <text x="1010" y="422" text-anchor="middle" font-size="11" font-weight="600" fill="#2451c9">→ rule_results[] (reducer join)</text>

  <!-- Risk & Summary -->
  <rect x="1160" y="300" width="160" height="150" rx="10" fill="#f2f0ff" stroke="#c9c2f5"/>
  <text x="1240" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#0b1220">3. Risk &amp;</text>
  <text x="1240" y="341" text-anchor="middle" font-size="13" font-weight="700" fill="#0b1220">Summary</text>
  <text x="1240" y="364" text-anchor="middle" font-size="11" fill="#5b6472">LLM · synthesizes</text>
  <text x="1240" y="380" text-anchor="middle" font-size="11" fill="#5b6472">terms + compliance</text>
  <text x="1240" y="396" text-anchor="middle" font-size="11" fill="#5b6472">→ risk register,</text>
  <text x="1240" y="412" text-anchor="middle" font-size="11" font-weight="600" fill="#2451c9">exec summary</text>

  <line x1="300" y1="375" x2="340" y2="375" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="375" x2="610" y2="375" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="840" y1="375" x2="880" y2="375" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1140" y1="375" x2="1160" y2="375" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Escalation gate -->
  <rect x="70" y="500" width="500" height="110" rx="10" fill="#fff7e6" stroke="#eccf8b"/>
  <text x="320" y="528" text-anchor="middle" font-size="13" font-weight="700" fill="#0b1220">Escalation Gate — Pure Python, no LLM</text>
  <text x="320" y="552" text-anchor="middle" font-size="11" fill="#5b6472">Unverified evidence · confidence &lt; 60% · critical risk ·</text>
  <text x="320" y="570" text-anchor="middle" font-size="11" fill="#5b6472">high-severity rule failure · declared gap → escalate for human review</text>
  <text x="320" y="592" text-anchor="middle" font-size="11" font-weight="600" fill="#b8860b">→ escalations[], overall_status</text>

  <line x1="1240" y1="450" x2="1240" y2="475" stroke="#5b6472" stroke-width="1.5"/>
  <line x1="1240" y1="475" x2="320" y2="475" stroke="#5b6472" stroke-width="1.5"/>
  <line x1="320" y1="475" x2="320" y2="500" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Orchestrator note -->
  <rect x="610" y="500" width="750" height="110" rx="10" fill="#f0f4ff" stroke="#c3d0f5"/>
  <text x="985" y="528" text-anchor="middle" font-size="13" font-weight="700" fill="#0b1220">Orchestrator = the LangGraph runtime itself</text>
  <text x="985" y="552" text-anchor="middle" font-size="11" fill="#5b6472">Shared DealState (Pydantic) threaded through every node · RetryPolicy(3 attempts, backoff) per LLM node</text>
  <text x="985" y="570" text-anchor="middle" font-size="11" fill="#5b6472">Failed node degrades gracefully into errors[] / needs_human_review instead of crashing the run</text>
  <text x="985" y="588" text-anchor="middle" font-size="11" fill="#5b6472">Every transition emitted as an SSE event → live timeline in the UI, persisted to audit trail</text>

  <!-- Output -->
  <rect x="70" y="650" width="1290" height="150" rx="10" fill="#ffffff" stroke="#0b1220" stroke-width="1.5"/>
  <text x="715" y="678" text-anchor="middle" font-size="14" font-weight="700" fill="#0b1220">Final Report (report.md + result.json, persisted to Postgres)</text>
  <text x="220" y="710" text-anchor="middle" font-size="12" font-weight="600" fill="#0b1220">Overall Assessment</text>
  <text x="220" y="728" text-anchor="middle" font-size="10" fill="#5b6472">PASS / FAIL / HUMAN REVIEW</text>
  <text x="430" y="710" text-anchor="middle" font-size="12" font-weight="600" fill="#0b1220">Executive Summary</text>
  <text x="430" y="728" text-anchor="middle" font-size="10" fill="#5b6472">+ follow-up actions</text>
  <text x="640" y="710" text-anchor="middle" font-size="12" font-weight="600" fill="#0b1220">Compliance Matrix</text>
  <text x="640" y="728" text-anchor="middle" font-size="10" fill="#5b6472">per-rule pass/fail/review</text>
  <text x="850" y="710" text-anchor="middle" font-size="12" font-weight="600" fill="#0b1220">Risk Register</text>
  <text x="850" y="728" text-anchor="middle" font-size="10" fill="#5b6472">prioritized by severity</text>
  <text x="1060" y="710" text-anchor="middle" font-size="12" font-weight="600" fill="#0b1220">Extracted Terms</text>
  <text x="1060" y="728" text-anchor="middle" font-size="10" fill="#5b6472">+ gaps</text>
  <text x="1250" y="710" text-anchor="middle" font-size="12" font-weight="600" fill="#0b1220">Evidence / Sources</text>
  <text x="1250" y="728" text-anchor="middle" font-size="10" fill="#5b6472">clause + page + quote</text>
  <text x="715" y="770" text-anchor="middle" font-size="11" fill="#5b6472">Every claim traceable to a clause_id and verbatim quote — verified deterministically, not merely asserted by the LLM.</text>

  <line x1="320" y1="610" x2="320" y2="650" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
